name: Scrape releases and update site data

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Scrape Seven Seas
        run: node scripts/scrape.mjs seven-seas
        continue-on-error: true

      - name: Scrape Viz
        run: node scripts/scrape.mjs viz
        continue-on-error: true

      - name: Scrape Kodansha
        run: node scripts/scrape.mjs kodansha
        continue-on-error: true

      - name: Scrape Yen Press
        run: node scripts/scrape.mjs yen-press
        continue-on-error: true

      - name: Scrape Square Enix
        run: node scripts/scrape.mjs square-enix
        continue-on-error: true

      - name: Rebuild site data
        run: npm run build-data

      - name: Commit and push if anything changed
        run: |
          git config user.name "next-volume-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/releases.csv lib/data.generated.json
          if git diff --cached --quiet -- data/releases.csv; then
            echo "No new releases found - nothing to commit."
          else
            git commit -m "Auto-update: scraped releases $(date -u +'%Y-%m-%d')"
            git push
          fi
